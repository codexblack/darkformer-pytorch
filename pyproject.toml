[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "darkformer"
dynamic = ["version"]
description = "Data-aware random feature attention for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "numpy>=1.26,<2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
]

[project.urls]
Paper = "https://arxiv.org/abs/2603.04127"

[tool.hatch.version]
path = "src/darkformer/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/README.md",
  "/photo.png",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/darkformer"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
]

[tool.ruff.lint.isort]
known-first-party = ["darkformer"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=darkformer",
  "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["darkformer"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "benchmarks"]
strict = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn_3"]
ignore_missing_imports = true
